name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      run_dependency_smoke:
        description: "Install full dependencies and run import smoke checks"
        required: false
        type: boolean
        default: false

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate Python syntax
        run: |
          python -m compileall -q \
            main.py \
            exploration.py \
            run_project.py \
            test_setup.py \
            models \
            pruning \
            quantization \
            utils

      - name: Validate shell scripts
        run: |
          bash -n setup.sh
          bash -n scripts/edge_llm_train.sh
          bash -n scripts/layer_wise_pruning.sh
          bash -n scripts/layer_wise_pruning_quantization.sh
          bash -n scripts/layer_wise_quantization.sh

  dependency-smoke:
    name: Dependency smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_dependency_smoke }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run import smoke checks
        run: python test_setup.py
